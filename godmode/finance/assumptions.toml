label = "Base"
outbound_prospects = 120
reply_to_demo = 0.05
demo_to_paid = 0.20
digest_subscribers_per_month = 60
digest_monthly_conversion = 0.002
mix = { pro = 0.60, team = 0.32, enterprise = 0.08 }
pilot_price_factor = 0.7
monthly_churn = 0.02
monthly_expansion = 0.005
services_packages = { months = 9, per_month = 2.0, price = 350.0 }
