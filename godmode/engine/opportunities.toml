# PROJECT GODMODE — opportunity dataset (Missions A and C)
#
# 50 technology opportunities for a solo, AI-leveraged founder based in
# Bangladesh with a pharmaceutical-sciences research background.
#
# SCORES ARE ANALYST JUDGMENTS, NOT MEASUREMENTS. They were assigned by the
# virtual founding team (product, engineering, sales, finance, red team) using
# the anchors below, then stress-tested by `score.py --sensitivity`, which
# perturbs every score and weight to show which rankings are robust and which
# are within noise. Evidence IDs point into evidence.toml; an opportunity with
# no evidence IDs rests on judgment alone.
#
# Score anchors (1-10):
#   severity            9-10 regulator-enforced, recurring, costly · 7-8 significant recurring cost/risk · 5-6 moderate inefficiency · <=4 nice-to-have
#   willingness_to_pay  9-10 enterprise spend >$10k/yr proven · 7-8 $2-10k/yr · 5-6 SMB $0.5-2k/yr · 3-4 consumer · <=2 free is expected
#   market              size AND reachability of the serviceable market
#   solo_feasibility    one founder + AI agents can build, sell and support it
#   ai_leverage         how much AI/automation creates a 10x, not a 10% gain
#   speed_to_mvp        10 = useful MVP in <2 weeks · 5 = ~3 months · 1 = >1 year
#   distribution        one founder can reach many buyers cheaply and repeatably
#   defensibility       achievable data / workflow / network / trust moats
#   capital_efficiency  cash needed to first revenue (10 = almost none)
#   expansion           credible adjacent products and markets
#
# Penalties are a fraction (0-1) of each penalty's maximum, defined below.

[meta]
version = 1
date = "2026-11-05"
founder_profile = "Solo founder, Bangladesh, pharmaceutical sciences + research, AI-tool access, unknown (assume low) capital, global ambition"

[weights]
severity = 0.15
willingness_to_pay = 0.15
market = 0.10
solo_feasibility = 0.10
ai_leverage = 0.10
speed_to_mvp = 0.10
distribution = 0.10
defensibility = 0.10
capital_efficiency = 0.05
expansion = 0.05

[penalty_catalogue]
heavy_regulation = { max = 0.6, description = "Product itself is regulated (GxP validation, HIPAA, SaMD, licensed advice) or carries liability for regulated decisions" }
hard_acquisition = { max = 0.5, description = "Long enterprise/government sales cycles, gatekeepers, or relationship-only channels" }
unstable_dependency = { max = 0.3, description = "Core value depends on third-party APIs, portals or licences that can change or be withdrawn" }
expensive_infra = { max = 0.3, description = "Material compute, data-licence or hosting cost before revenue" }
high_support = { max = 0.4, description = "Onboarding, data entry or human delivery effort scales with customers" }
weak_differentiation = { max = 0.6, description = "Credible incumbents or free tools already solve most of the problem" }
unproven_demand = { max = 0.4, description = "No evidence yet that this buyer pays for this outcome" }
security_exposure = { max = 0.5, description = "Holds confidential, personal or regulated data that raises breach impact and procurement friction" }

# --------------------------------------------------------------------------
# A. Pharma & life-sciences regulatory operations (founder-advantaged)
# --------------------------------------------------------------------------

[[opportunity]]
id = "O01"
name = "LabelLedger — reference-label change intelligence and generic label drift detection"
sector = "pharma-regulatory"
concept = "Version-control every public drug label, explain each change section by section, and flag generic labels that have drifted out of sync with their reference."
customer = "Labeling and regulatory-affairs teams at generic manufacturers (US ANDA holders first, many run from India/Bangladesh), plus the regulatory consultancies that serve them."
problem = "Generic labels must track reference-label changes; teams compare 30-80 page labels by hand, miss updates, and must produce side-by-side comparisons for every labeling submission."
alternatives = "Manual DailyMed/Drugs@FDA checks, FDA SrLC database, enterprise label-intelligence platforms, consultancies."
gap = "SrLC excludes ANDAs, non-safety sections and pre-2016 history; enterprise tools are quote-only and priced for large companies; nothing self-serve is generics-first."
solution = "Watchlists of reference labels, deterministic section-aware redlines, severity triage, drift reports against your own labels, AI-written impact summaries grounded in the diff, submission-ready comparison drafts."
technology = "SPL XML parsing (LOINC sections), alignment and token diffing, fuzzy sentence matching, rules-based severity, grounded LLM summaries, scheduled polling, web app."
mvp = "Parse/diff/triage engine + drift checker + HTML/Markdown/JSON reports + watchlist poller + minimal web UI (built in this session)."
complexity = "medium"
capital = "<$1k to first revenue (hosting, domain, LLM tokens)"
pricing = "Free public label history + weekly digest; Pro $199/mo (50 watched labels); Team $599/mo (300 labels, drift reports, comparison drafts); Enterprise/API custom."
acquisition = "Free weekly 'reference label changes' digest; personalised drift snapshots built from public data as outbound hooks; LinkedIn RA community; programmatic label-history pages."
competition = "Dr.Evidence (728k labels, RLD alerts), Basil Systems, Freyr/Freya, IQVIA RIM Smart Labeling, Sarjen KnowledgeNet, in-house scripts."
defensibility_note = "Accumulated version archive (captured from day one), generics-specific workflow, trust in accuracy, multi-authority coverage over time, distribution via public layer."
regulatory = "Decision support on public data; no PHI. Accuracy liability managed by deterministic diffs, provenance and human review; never auto-submits."
main_risk = "Target buyers already satisfied by incumbents or by manual process; willingness to pay for 'monitoring' alone proves low."
evidence_needed = "10 interviews confirming manual effort and missed updates; 3 paid pilots >= $200/mo within 60 days; drift snapshots that prospects call accurate."
evidence = ["E01", "E02", "E03", "E04", "E05", "E06", "E22", "E23"]
tags = ["solo_friendly", "ai_native", "low_capital", "fast_to_market", "enterprise", "infrastructure"]
scores = { severity = 7, willingness_to_pay = 7, market = 6, solo_feasibility = 9, ai_leverage = 8, speed_to_mvp = 9, distribution = 7, defensibility = 5, capital_efficiency = 9, expansion = 8 }
penalties = { weak_differentiation = 0.5, unproven_demand = 0.25 }
rationale = "Regulator-defined obligation, fully public structured data, demonstrable value before any customer shares data, and a data-infrastructure path. Competition is real, so positioning and validation speed matter."

